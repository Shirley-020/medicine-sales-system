spring.application.name=medicine-sales-system

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 核心配置：让JPA自动创建/更新表（开发环境用update，生产环境用none）
spring.jpa.hibernate.ddl-auto=update
# 可选：显示生成的SQL语句，方便排查（新手建议开启）
spring.jpa.show-sql=true
# 可选：格式化SQL输出，更易读
spring.jpa.properties.hibernate.format_sql=true

# Typically you should override datasource settings per-profile (see application-dev.properties)
# For local development, set SPRING_PROFILES_ACTIVE=dev (or use -Dspring.profiles.active=dev) or
# create an .env and run `docker compose up` to start a local MySQL instance (see docker-compose.yml and database/README.md).
# Example override (do NOT commit credentials):
# spring.datasource.url=jdbc:mysql://localhost:3306/medicine_sales
# spring.datasource.username=root
# spring.datasource.password=secret
# spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:13306/medicine_sales?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT settings (development defaults; override in prod via env or profiles)
jwt.secret=change-me-to-a-secure-random-secret
jwt.expiration-ms=86400000

# CORS allowed origins (comma separated). Use '*' to allow all during development.
# Example: cors.allowed-origins=http://localhost:3000
cors.allowed-origins=*