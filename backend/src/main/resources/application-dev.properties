# Development database configuration (local MySQL)
# Use: set -Dspring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev when running the app
# Default points to local Docker MySQL mapped on port 13306
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:medicine_sales}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:medicine}
spring.datasource.password=${MYSQL_PASSWORD:medicine123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: migrations run automatically on startup (configured in main application.properties)
spring.flyway.enabled=false

# 开发环境临时允许 Hibernate 自动更新/创建表，以便在无法运行 Flyway 时快速调试
spring.jpa.hibernate.ddl-auto=update

# Connection pool tuning (Hikari)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Enable HTTPS for local development using self-signed keystore (keystore.p12)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=selfsigned
