services:
  mysql:
    image: mysql:8.0
    container_name: medicine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: medicine_sales
      MYSQL_USER: medicine
      MYSQL_PASSWORD: medicine123
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+08:00

  adminer:
    image: adminer
    container_name: medicine-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  mysql_data:
